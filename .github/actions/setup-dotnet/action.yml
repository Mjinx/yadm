name: Setup .NET
description: Install the SDK from global.json (net11.0) plus the 10.0.x runtime so every target framework builds and tests, with NuGet caching.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: |
          **/*.csproj
          Directory.Packages.props
