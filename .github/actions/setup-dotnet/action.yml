name: Setup .NET
description: Install the SDKs needed to build (global.json) and test on net10.0, with NuGet caching.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: |
          **/*.csproj
          Directory.Packages.props
