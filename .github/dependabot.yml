version: 2
updates:
  - package-ecosystem: nuget
    cooldown:
      default-days: 3
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: [ '*' ]
  - package-ecosystem: github-actions
    cooldown:
      default-days: 3
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: [ '*' ]
