name: Release

# Tag pushes publish to both GitHub Packages and NuGet.org. NuGet.org uses
# short-lived OIDC credentials; GitHub Packages uses the workflow token.
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_SOURCE: ${{ format('https://nuget.pkg.github.com/{0}/index.json', github.repository_owner) }}
      GITHUB_PACKAGES_API_KEY: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require tag on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup-dotnet
      # API-compat baseline: latest earlier stable tag of the same major version.
      - name: Find baseline
        id: baseline
        shell: bash
        run: |
          prev=$(git tag -l | bash .github/scripts/find-baseline.sh "$GITHUB_REF_NAME")
          if [ -z "$prev" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          dir="$RUNNER_TEMP/package-baselines"; mkdir -p "$dir"
          gh release download "$prev" --pattern '*.nupkg' --dir "$dir"
          echo "args=-p:PackageValidationBaselineVersion=${prev#v} -p:RestoreAdditionalProjectSources=$dir" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/validate-package
        with:
          args: ${{ steps.baseline.outputs.args }}
      - name: NuGet.org login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        shell: bash
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate
      - name: Publish to GitHub Packages
        shell: bash
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "$GITHUB_PACKAGES_SOURCE"
          --api-key "$GITHUB_PACKAGES_API_KEY"
          --skip-duplicate
      - name: GitHub release
        shell: bash
        run: |
          flags=""; case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $flags --generate-notes \
            --title "Yadm $GITHUB_REF_NAME" --verify-tag artifacts/packages/*
