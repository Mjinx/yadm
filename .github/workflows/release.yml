name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - current

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases may only run from main."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -n "$latest" ]]; then
            current="${latest#v}"
          else
            current="$(dotnet msbuild ./src/Yadm.Common/Yadm.Common.csproj -nologo -getProperty:Version)"
          fi

          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major)   version="$((major + 1)).0.0" ;;
            minor)   version="${major}.$((minor + 1)).0" ;;
            patch)   version="${major}.${minor}.$((patch + 1))" ;;
            current) version="$current" ;;
          esac

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists."
            exit 1
          fi

          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.bump }}" != "major" && -n "$latest" ]]; then
            echo "baseline=${current}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore ./Yadm.slnx

      - name: Build
        run: dotnet build ./Yadm.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.value }} -p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --solution ./Yadm.slnx -c Release --no-build --no-restore

      - name: Pack
        shell: bash
        run: |
          baseline=()
          if [[ -n "${{ steps.version.outputs.baseline }}" ]]; then
            baseline+=("-p:PackageValidationBaselineVersion=${{ steps.version.outputs.baseline }}")
          fi

          for project in \
            ./src/Yadm.Common/Yadm.Common.csproj \
            ./src/Yadm.SystemTextJson/Yadm.SystemTextJson.csproj; do
            dotnet pack "$project" \
              -c Release \
              --no-build \
              --no-restore \
              -p:Version=${{ steps.version.outputs.value }} \
              -p:PackageVersion=${{ steps.version.outputs.value }} \
              -o ./artifacts/packages \
              "${baseline[@]}"
          done

      - name: Publish packages
        shell: bash
        run: |
          for package in ./artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$GITHUB_TOKEN" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --skip-duplicate
          done

      - name: Create GitHub release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --title "Yadm ${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            ./artifacts/packages/*
